name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project (unzip if needed)
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            Z=$(find . -maxdepth 2 -iname '*.zip' | head -n 1)
            unzip -q "$Z" -d _src
            D=$(dirname "$(find _src -name settings.gradle.kts | head -n 1)")
            echo "PROJECT_DIR=$D" >> $GITHUB_ENV
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: Agenda-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk
